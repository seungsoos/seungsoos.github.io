li a{display:block;padding:14px 15px 3px;color:var(--dark);font-weight:800;text-decoration:none}
li span{display:block;padding:0 15px 13px;color:var(--muted);font-size:12.5px}
li a:hover{text-decoration:underline}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
@media(prefers-color-scheme:dark){:root{--bg:#17150F;--ink:#F2ECE2;--muted:#A79E92;--line:#332E27;--dark:#8BD68F}li{background:#201D17}}
